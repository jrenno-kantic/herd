[package]
name = "herd"
version = "0.2.1"
edition = "2021"
# The floor that has actually been built and tested, not a probe of the
# true minimum. Edition 2024 is a separate, deliberate migration: it makes
# `env::set_var` unsafe, which the config-resolution tests use.
rust-version = "1.97"
description = "Terminal control plane for llama-server"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
libc = "0.2.189"
