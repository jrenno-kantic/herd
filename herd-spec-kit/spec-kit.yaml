id: herd
name: HERD
version: 2.2.0
date: 2026-08-10

description: >
  Terminal launcher for local LLMs. Browse the model presets in a
  llama-server models.ini, launch one, monitor its lifecycle, and
  override server and model options for the session.

tech:
  language: Rust
  ui: ratatui
  runtime: tokio

goals:
  - user-friendly: browse and launch, no command line required
  - keyboard-first UX
  - trustworthy state: the displayed lifecycle reflects the real process
  - never mutate the user's hand-maintained models.ini
  - non-blocking UI: no I/O on the render path
