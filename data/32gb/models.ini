; ==================================================#
; llama-server models preset
;
; Usage:
;   llama-server \
;     --models-preset ~/models/32gb/models.ini \
;     --models-max 2 \
;     --sleep-idle-seconds 300
;
; ==================================================#


; ==================================================
; server
; ==================================================
[server]
host = 0.0.0.0
port = 1234

#reasoning-format = none
#temp = 1.0
#top-p = 0.95
jinja = true


; ==================================================
; default
; ==================================================
[*]
ctx-size = 32768
gpu-layers = 99

flash-attn = on


; ==================================================
; mono-focus  (optional profile, off by default)
;
; A reserved section, like [server] and [*] — herd never offers it as a
; preset. Switch it on per preset with `m` on the Settings screen; it is
; remembered in ~/.herd_config.
;
; Applied AFTER the preset's own keys and BEFORE the Settings-screen
; overrides, so it forces these values onto a preset that says otherwise
; while still letting you take any single one of them back:
;
;   [server] -> [*] -> [model] -> mono-focus -> overrides -> CLI
;
; For one client looping on the same base prompt: one slot, keep the whole
; prompt, and reuse the common prefix rather than sharing the KV cache out.
; ==================================================
[mono-focus]
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
cache-reuse = 256
keep = -1

; `--slots` is a boolean in llama.cpp — it exposes the slots monitoring
; endpoint and is already on by default. The slot *count* is `parallel`,
; above. Written `slots = 1` herd would emit `--slots 1`, leaving a stray
; `1` on llama-server's command line, so it is spelled as a flag here.
slots = true


; ==================================================
; Gemma 4 12B QAT + MTP
; ==================================================
[gemma4-12b]
hf-repo = unsloth/gemma-4-12B-it-qat-GGUF:UD-Q4_K_XL
alias = gemma4-12b

#chat-template-kwargs = {"enable_thinking":false}
reasoning = off

spec-type = draft-mtp
spec-draft-n-max = 4

no-mmproj = true


